[tools]
uv = "0.12.9"

[tasks.install]
description = "Install locked development dependencies with uv-managed Python"
run = 'uv sync --locked --extra dev --python "${PHANTASM_PYTHON_VERSION:-3.11}"'

[tasks.test]
description = "Run the test suite"
run = 'uv run --locked --extra dev --python "${PHANTASM_PYTHON_VERSION:-3.11}" pytest'

[tasks.lint]
description = "Check lint and formatting"
run = ['uv run --locked --extra dev --python "${PHANTASM_PYTHON_VERSION:-3.11}" ruff check .', 'uv run --locked --extra dev --python "${PHANTASM_PYTHON_VERSION:-3.11}" ruff format --check .']

[tasks.build]
description = "Build source distribution and wheel"
run = 'uv build --python "${PHANTASM_PYTHON_VERSION:-3.11}"'

[tasks.check-dist]
description = "Test installed distributions outside the checkout"
run = 'uv run --locked --extra dev --python "${PHANTASM_PYTHON_VERSION:-3.11}" python scripts/check_dist.py'

[tasks.install-training]
description = "Create the pinned GPU training environment from the hashed lock"
run = [
    'uv venv --python 3.11 .venv-training',
    'uv pip sync --python .venv-training/bin/python --require-hashes src/phantasm/resources/training.txt',
    'uv pip install --python .venv-training/bin/python --no-deps -e .',
    'uv pip check --python .venv-training/bin/python',
]
