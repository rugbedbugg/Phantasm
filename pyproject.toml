[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantasm"
version = "0.1.0"
description = "Pipeline framework for preparing conversational datasets, LoRA fine-tuning, and quantized local GGUF inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
inference = [
    "llama-cpp-python>=0.2.80",
]

[project.scripts]
phantasm = "phantasm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.setuptools.package-data]
phantasm = ["resources/*.txt"]
