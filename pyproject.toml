[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantasm"
version = "0.1.0"
description = "Reproducible pipeline for conversational persona reconstruction: leakage-safe datasets, response-only QLoRA fine-tuning, privacy auditing and persona-fidelity evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
inference = [
    "llama-cpp-python>=0.2.80",
]
# There is deliberately no "training" extra. The GPU stack (Unsloth, PyTorch,
# xformers) only resolves for one platform at a time, so declaring it here makes
# this project's universal lock unsatisfiable. The tested training environment
# is the hashed lock in src/phantasm/resources/training.txt, generated from
# requirements/training.in; see docs/TRAINING.md.

[project.scripts]
phantasm = "phantasm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.setuptools.package-data]
phantasm = ["resources/*.txt"]
